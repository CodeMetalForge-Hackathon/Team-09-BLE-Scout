<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rescue Team</title>
<style>
  :root { --bg:#0e1217; --panel:#171c23; --line:#262e38; --text:#e7eaee; --muted:#8b96a3;
          --accent:#3d9bff; --ok:#3ecf8e; --warn:#ffb020; --bad:#ff5a5a; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text);
         padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); max-width:520px; margin:auto; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .muted { color:var(--muted); font-size:14px; }
  input { width:100%; font-size:18px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  button { font:inherit; font-size:17px; padding:14px; border-radius:12px; border:1px solid var(--line); background:#232b35; color:var(--text); width:100%; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .mission { background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--warn); border-radius:12px; padding:14px; }
  .mission h2 { margin:0 0 6px; font-size:26px; }
  .dir { font-size:19px; margin:10px 0; } .dir b { color:#fff; }
  svg { width:100%; background:var(--panel); border-radius:12px; margin-top:14px; display:block; }
  .hidden { display:none !important; }
  .help { border-color:var(--bad); color:var(--bad); grid-column:span 2; }
  .flash { animation: flash 1s ease-out 3; } @keyframes flash { 50% { background:#3a2d10; } }
</style>
</head>
<body>
<h1>🛟 Rescue Team</h1>

<div id="join">
  <p class="muted">Enter your name to join. The operator will send you to a location.</p>
  <input id="name" placeholder="Your name" autocomplete="name">
  <div style="height:10px"></div>
  <button class="primary" onclick="join()">Join team</button>
</div>

<div id="main" class="hidden">
  <div class="muted" id="who"></div>
  <div id="mission" class="mission" style="margin-top:10px"></div>
  <svg id="map"></svg>
  <div class="grid" id="actions">
    <button onclick="status('en_route')">🟠 On my way</button>
    <button onclick="status('arrived')">🔵 Arrived</button>
    <button class="primary" onclick="status('cleared')" style="grid-column:span 2">✅ Cluster cleared: next one</button>
    <button class="help" onclick="if(confirm('Request help?')) status('need_help')">🆘 Need help</button>
  </div>
  <p class="muted" style="margin-top:18px">Positions are measured from the <b>door corner</b>: first along the wall to the right of the door, then straight into the room. Bluetooth estimates are rough (±1–2 m), so search the whole circle.</p>
  <button style="margin-top:6px" onclick="leave()">Leave team</button>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me = null, lastAssigned = undefined;
try { me = localStorage.getItem('rescue_member'); } catch (e) {}

async function join() {
  const r = await fetch('/api/team/join', {method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify({name: $('name').value})});
  me = (await r.json()).id;
  try { localStorage.setItem('rescue_member', me); } catch (e) {}
  tick();
}
function leave() { try { localStorage.removeItem('rescue_member'); } catch (e) {} me = null; location.reload(); }
async function status(s) {
  await fetch(`/api/team/${me}/status`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:s})});
  tick();
}

function drawMap(room, clusters, mine) {
  const pad = 1, W = room.width + 2*pad, H = room.length + 2*pad;
  const svg = $('map'); svg.setAttribute('viewBox', `${-pad} ${-room.length - pad} ${W} ${H}`);
  let s = `<rect x="0" y="${-room.length}" width="${room.width}" height="${room.length}" fill="none" stroke="#9aa6b2" stroke-width="0.06"/>`;
  s += `<text x="0.1" y="0.55" font-size="0.4" fill="#9aa6b2">DOOR</text><circle cx="0" cy="0" r="0.15" fill="#9aa6b2"/>`;
  for (const c of clusters) {
    const mineC = c.id === mine, col = mineC ? '#ffb020' : c.state === 'cleared' ? '#3ecf8e' : '#5b6875';
    const r = Math.max(c.radius_m, 0.5) + (mineC ? c.uncertainty_m : 0);
    s += `<circle cx="${c.x}" cy="${-c.y}" r="${r}" fill="${col}" fill-opacity="${mineC ? .25 : .1}" stroke="${col}" stroke-width="${mineC ? .1 : .04}"/>`;
    s += `<text x="${c.x}" y="${-c.y + 0.18}" font-size="${mineC ? .6 : .4}" text-anchor="middle" fill="${mineC ? '#fff' : '#8b96a3'}" font-weight="bold">${esc(c.id)}</text>`;
  }
  if (mine) {
    const c = clusters.find(c => c.id === mine);
    if (c) s += `<line x1="0" y1="0" x2="${c.x}" y2="0" stroke="#ffb020" stroke-width="0.07" stroke-dasharray="0.2 0.15"/>
                 <line x1="${c.x}" y1="0" x2="${c.x}" y2="${-c.y}" stroke="#ffb020" stroke-width="0.07" stroke-dasharray="0.2 0.15"/>`;
  }
  svg.innerHTML = s;
}

async function tick() {
  if (!me) { $('join').classList.remove('hidden'); $('main').classList.add('hidden'); return; }
  let d;
  try {
    const r = await fetch(`/api/team/${me}`);
    if (r.status === 404) { leave(); return; }
    d = await r.json();
  } catch (e) { $('who').textContent = 'Connection lost. Retrying…'; return; }
  $('join').classList.add('hidden'); $('main').classList.remove('hidden');
  const st = {available:'🟢 Standing by', en_route:'🟠 On the way', arrived:'🔵 Arrived', cleared:'✅ Cleared', need_help:'🆘 Help requested'};
  $('who').textContent = `${d.me.name} · ${st[d.me.status] || d.me.status}`;
  const c = d.cluster, m = $('mission');
  if (c) {
    m.innerHTML = `<h2>Go to Cluster ${esc(c.id)}</h2>
      <div class="dir">From the door corner, walk <b>${c.x.toFixed(1)} m</b> along the wall to your right, then turn and go <b>${c.y.toFixed(1)} m</b> into the room.</div>
      <div class="muted">About <b>${c.count}</b> device${c.count > 1 ? 's' : ''} (people may carry 1–3 each). Search within <b>~${(c.radius_m + c.uncertainty_m).toFixed(1)} m</b> of that spot.</div>`;
    m.style.borderLeftColor = 'var(--warn)';
  } else {
    m.innerHTML = `<h2>Standing by</h2><div class="muted">Waiting for the operator to assign you a location.</div>`;
    m.style.borderLeftColor = 'var(--line)';
  }
  if (lastAssigned !== undefined && c && c.id !== lastAssigned) { m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); navigator.vibrate?.(300); }
  lastAssigned = c ? c.id : null;
  $('actions').classList.toggle('hidden', !c && d.me.status !== 'need_help');
  drawMap(d.room, d.clusters, c && c.id);
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
