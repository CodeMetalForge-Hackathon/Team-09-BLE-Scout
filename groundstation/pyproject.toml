[project]
name = "groundstation"
version = "0.1.0"
description = "Ground station for BLE Scout: phones stream their scans here; a live dashboard shows everyone on one map."
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "certifi>=2024.2.2",
    "zeroconf>=0.130",
]

[project.scripts]
groundstation = "station.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["station"]
